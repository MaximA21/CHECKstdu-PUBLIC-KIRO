name: Code Quality and Security

on:
  push:
    branches: [ kiro-rewrite ]
  pull_request:
    branches: [ kiro-rewrite ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9","3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy bandit safety pip-audit pytest-cov

    - name: Code formatting check with Black
      run: |
        black --check --diff src/ tests/ lambda_functions/ examples/

    - name: Import sorting check with isort
      run: |
        isort --check-only --diff src/ tests/ lambda_functions/ examples/

    - name: Linting with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ lambda_functions/ examples/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 src/ tests/ lambda_functions/ examples/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Allow type checking to fail without stopping the workflow

  security-scan:
    runs-on: ubuntu-latest
    needs: code-quality
    # Skip advanced security scanning for cost optimization (task 6.2)
    if: github.event_name != 'pull_request' && contains(github.event.head_commit.message, '[security-scan]')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety pip-audit

    - name: Basic security scanning with Bandit (essential only)
      run: |
        echo "🔍 Running basic security scan (cost-optimized)..."
        bandit -r src/ lambda_functions/ -f json -o bandit-report.json --severity-level medium || true
        bandit -r src/ lambda_functions/ -f txt --severity-level medium

    - name: Basic dependency vulnerability check
      run: |
        echo "🔍 Running basic dependency vulnerability check..."
        pip-audit --format=json --output=pip-audit-report.json --desc || true
        pip-audit --desc

    - name: Upload basic security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ github.sha }}
        path: |
          bandit-report.json
          pip-audit-report.json

  # Basic security validation (always runs)
  basic-security-check:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install basic security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Quick security scan (high severity only)
      run: |
        echo "🔍 Running quick security scan for high severity issues..."
        bandit -r src/ lambda_functions/ --severity-level high -f txt || true

    - name: Quick dependency check (high severity only)
      run: |
        echo "🔍 Running quick dependency vulnerability check..."
        pip-audit --desc --vulnerability-service pypi || true

    - name: Validate security controls configuration
      run: |
        echo "🔍 Validating security controls are properly configured..."
        
        # Check for hardcoded secrets patterns
        echo "Checking for potential hardcoded secrets..."
        if grep -r -i "password\|secret\|key\|token" --include="*.py" --include="*.yml" --include="*.yaml" src/ .github/ terraform/ | grep -v "# " | grep -v "description" | grep -v "variable" | head -5; then
          echo "⚠️ Potential hardcoded secrets found - review above matches"
        else
          echo "✅ No obvious hardcoded secrets found"
        fi
        
        # Check .gitignore for security patterns
        echo "Checking .gitignore for security patterns..."
        if grep -q "secrets\|credentials\|\.env" .gitignore; then
          echo "✅ .gitignore includes security patterns"
        else
          echo "⚠️ .gitignore may be missing security patterns"
        fi
        
        # Check Terraform for AWS managed keys usage
        echo "Checking Terraform for cost-optimized security settings..."
        if grep -q "enable_custom_kms_keys.*false" terraform/variables.tf; then
          echo "✅ Using AWS managed keys for cost optimization"
        else
          echo "⚠️ Custom KMS keys may be enabled (increases costs)"
        fi

  test-coverage:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=80

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-${{ github.sha }}
        path: |
          coverage.xml
          htmlcov/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quality-gate:
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, basic-security-check, test-coverage]
    if: always()

    steps:
    - name: Check job results
      run: |
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Basic Security Check: ${{ needs.basic-security-check.result }}"
        echo "Test Coverage: ${{ needs.test-coverage.result }}"
        
        if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
          echo "❌ Code quality checks failed"
          exit 1
        fi
        
        # Basic security check must pass
        if [[ "${{ needs.basic-security-check.result }}" != "success" ]]; then
          echo "❌ Basic security checks failed"
          exit 1
        fi
        
        # Advanced security scan is optional (cost optimization)
        if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
          echo "⚠️ Advanced security scan failed - check artifacts if enabled"
        elif [[ "${{ needs.security-scan.result }}" == "success" ]]; then
          echo "✅ Advanced security scan passed"
        else
          echo "ℹ️ Advanced security scan skipped for cost optimization"
        fi
        
        if [[ "${{ needs.test-coverage.result }}" != "success" ]]; then
          echo "❌ Test coverage requirements not met"
          exit 1
        fi
        
        echo "✅ Quality gates passed (cost-optimized security configuration)"