name: Comprehensive Testing

on:
  push:
    branches: [ kiro-rewrite ]
  pull_request:
    branches: [ kiro-rewrite ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - integration
        - e2e
        - performance

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 60

jobs:
  # Unit Tests with Coverage
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run unit tests with coverage
      run: |
        pytest tests/domain/ tests/application/ tests/presentation/ tests/shared/ tests/test_dependency_injection.py \
          -m "unit or not (integration or e2e or performance)" \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
          --junitxml=unit-test-results-${{ matrix.python-version }}.xml \
          -v

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: |
          unit-test-results-${{ matrix.python-version }}.xml
          coverage.xml
          htmlcov/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: unit-tests-coverage

  # Integration Tests with AWS Mocking
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Set up test environment
      run: |
        export ENVIRONMENT=test
        export USE_MOCK_SERVICES=true
        export AWS_DEFAULT_REGION=us-east-1
        export AWS_ACCESS_KEY_ID=testing
        export AWS_SECRET_ACCESS_KEY=testing
        export AWS_SECURITY_TOKEN=testing
        export AWS_SESSION_TOKEN=testing

    - name: Run integration tests
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
        AWS_DEFAULT_REGION: us-east-1
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
        AWS_SECURITY_TOKEN: testing
        AWS_SESSION_TOKEN: testing
      run: |
        pytest tests/integration/ tests/infrastructure/ \
          -m "integration" \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --junitxml=integration-test-results.xml \
          -v \
          --tb=short

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          integration-test-results.xml
          coverage.xml

  # End-to-End Tests
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Set up test environment for E2E
      run: |
        export ENVIRONMENT=test
        export USE_MOCK_SERVICES=true
        export AWS_DEFAULT_REGION=us-east-1
        export AWS_ACCESS_KEY_ID=testing
        export AWS_SECRET_ACCESS_KEY=testing
        export AWS_SECURITY_TOKEN=testing
        export AWS_SESSION_TOKEN=testing

    - name: Run end-to-end tests
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
        AWS_DEFAULT_REGION: us-east-1
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
        AWS_SECURITY_TOKEN: testing
        AWS_SESSION_TOKEN: testing
      run: |
        pytest tests/e2e/ \
          -m "e2e" \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --junitxml=e2e-test-results.xml \
          -v \
          --tb=short \
          --timeout=300

    - name: Upload e2e test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          e2e-test-results.xml
          coverage.xml

  # Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies including performance tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pytest-benchmark locust memory-profiler psutil

    - name: Set up test environment for performance
      run: |
        export ENVIRONMENT=test
        export USE_MOCK_SERVICES=true
        export AWS_DEFAULT_REGION=us-east-1

    - name: Run performance tests
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
        AWS_DEFAULT_REGION: us-east-1
      run: |
        pytest tests/performance/ \
          -m "performance" \
          --benchmark-json=performance-results.json \
          --junitxml=performance-test-results.xml \
          -v \
          --tb=short

    - name: Run basic load tests
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
      run: |
        # Run basic load tests
        python3 tests/performance/load_test_runner.py || echo "Load test runner not found, skipping load tests"

    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: |
          performance-test-results.xml
          performance-results.json

    # Test Summary and Quality Gate
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, performance-tests, streamlined-deployment-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run comprehensive coverage check
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
        AWS_DEFAULT_REGION: us-east-1
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
      run: |
        # Run all tests to get comprehensive coverage
        pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
          --junitxml=comprehensive-test-results.xml \
          -v \
          --tb=short

    - name: Download all test artifacts
      uses: actions/download-artifact@v4

    - name: Generate test summary
      run: |
        echo "# Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Job Results" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Streamlined Deployment Tests: ${{ needs.streamlined-deployment-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count test files
        if [ -d "unit-test-results-3.11" ]; then
          echo "## Test Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Unit test results available for Python 3.9, 3.10, 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- Integration test results available" >> $GITHUB_STEP_SUMMARY
          echo "- E2E test results available" >> $GITHUB_STEP_SUMMARY
          echo "- Performance test results available" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Check quality gate
      run: |
        echo "Checking comprehensive testing quality gate..."
        
        # Check if all required tests passed
        if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
          echo "❌ Unit tests failed"
          exit 1
        fi
        
        if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "❌ Integration tests failed"
          exit 1
        fi
        
        if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
          echo "❌ E2E tests failed"
          exit 1
        fi
        
        # Performance tests are allowed to fail with warning
        if [[ "${{ needs.performance-tests.result }}" != "success" ]]; then
          echo "⚠️ Performance tests completed with issues - check artifacts"
        fi
        
        echo "✅ Comprehensive testing quality gate passed"
        echo "All critical test suites executed successfully with required coverage"

  # Streamlined Deployment Testing Integration
  streamlined-deployment-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/kiro-rewrite'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run streamlined deployment tests
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
        AWS_DEFAULT_REGION: eu-central-1
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
      run: |
        echo "🚀 Running Streamlined Deployment Tests"
        
        # Run deployment-specific tests
        pytest tests/deployment/test_streamlined_deployment.py \
          -v \
          --tb=short \
          --junitxml=streamlined-deployment-results.xml

    - name: Test deployment scripts functionality
      env:
        ENVIRONMENT: staging
        AWS_DEFAULT_REGION: eu-central-1
      run: |
        echo "🔧 Testing deployment scripts"
        
        # Test deployment testing script
        python scripts/deployment_testing.py --help
        
        # Test rollback script help
        python scripts/rollback.py --help
        
        # Test health check script help  
        python scripts/health-check.py --help

    - name: Validate CI/CD pipeline configuration
      run: |
        echo "📋 Validating CI/CD pipeline configuration"
        
        # Check required workflow files exist
        required_workflows=(
          ".github/workflows/code-quality-security.yml"
          ".github/workflows/comprehensive-testing.yml"
          ".github/workflows/build-package.yml"
          ".github/workflows/deployment.yml"
          ".github/workflows/streamlined-deployment-testing.yml"
        )
        
        for workflow in "${required_workflows[@]}"; do
          if [[ ! -f "$workflow" ]]; then
            echo "❌ Missing required workflow: $workflow"
            exit 1
          else
            echo "✅ Found workflow: $workflow"
          fi
        done

    - name: Test Terraform validation pipeline
      run: |
        echo "🏗️ Testing Terraform validation"
        
        # Test terraform validation script
        if [[ -f "scripts/terraform-validate.sh" ]]; then
          chmod +x scripts/terraform-validate.sh
          # Run in dry-run mode to test script logic
          TERRAFORM_DIR="terraform" \
          AWS_REGION="eu-central-1" \
          ENVIRONMENT="validation" \
          bash scripts/terraform-validate.sh || echo "Terraform validation test completed"
        fi

    - name: Upload streamlined deployment test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: streamlined-deployment-test-results
        path: |
          streamlined-deployment-results.xml

  # Optional: Quick feedback for PRs
  quick-feedback:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run quick smoke tests
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
      run: |
        # Run a subset of fast tests for quick feedback
        pytest tests/domain/ tests/application/ tests/shared/ \
          -m "unit and not slow" \
          --maxfail=5 \
          --tb=short \
          -q \
          --durations=10

    - name: Quick integration check
      env:
        ENVIRONMENT: test
        USE_MOCK_SERVICES: true
        AWS_DEFAULT_REGION: us-east-1
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
      run: |
        # Run a subset of integration tests
        pytest tests/integration/test_full_search_flow.py \
          -k "test_basic" \
          --maxfail=3 \
          --tb=short \
          -q