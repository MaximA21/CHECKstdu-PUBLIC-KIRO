name: Build and Package

on:
  push:
    branches: [ kiro-rewrite ]
  pull_request:
    branches: [ kiro-rewrite ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - lambda
        - docker
        - terraform

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: 'eu-central-1'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lambda Function Packaging
  lambda-packaging:
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'lambda' || github.event.inputs.build_type == ''
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lambda-${{ hashFiles('lambda_functions/*/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lambda-

    - name: Install packaging dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Create Lambda packages directory
      run: mkdir -p lambda_packages

    - name: Package Lambda functions
      run: |
        echo "🚀 Packaging Lambda functions with DI container..."
        
        # List of Lambda functions to package
        LAMBDA_FUNCTIONS=(
          "address_normalizer"
          "authorizer" 
          "connect_handler"
          "connection_limit_enforcer"
          "disconnect_handler"
          "ping_perfect_signer"
          "requestor_handler"
          "results_handler"
          "search_handler"
          "share_api"
        )
        
        for func_name in "${LAMBDA_FUNCTIONS[@]}"; do
          echo "📦 Packaging $func_name..."
          
          # Create temporary build directory
          BUILD_DIR="lambda_build_${func_name}"
          mkdir -p "$BUILD_DIR"
          
          # Copy source code (entire src directory for DI container)
          cp -r src/ "$BUILD_DIR/"
          
          # Copy function-specific handler
          if [ -d "lambda_functions/$func_name" ]; then
            cp lambda_functions/$func_name/*.py "$BUILD_DIR/"
            
            # Install function-specific dependencies if requirements.txt exists
            if [ -f "lambda_functions/$func_name/requirements.txt" ]; then
              pip install -r "lambda_functions/$func_name/requirements.txt" --target "$BUILD_DIR" --no-deps
            fi
          fi
          
          # Install core dependencies
          pip install -r requirements.txt --target "$BUILD_DIR" --no-deps
          
          # Remove unnecessary files to reduce package size
          find "$BUILD_DIR" -name "*.pyc" -delete
          find "$BUILD_DIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$BUILD_DIR" -name "*.dist-info" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$BUILD_DIR" -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$BUILD_DIR" -name "*test*" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # Create ZIP package
          cd "$BUILD_DIR"
          zip -r9 "../lambda_packages/${func_name}.zip" . > /dev/null
          cd ..
          
          # Cleanup build directory
          rm -rf "$BUILD_DIR"
          
          # Check package size
          PACKAGE_SIZE=$(stat -c%s "lambda_packages/${func_name}.zip" 2>/dev/null || stat -f%z "lambda_packages/${func_name}.zip")
          PACKAGE_SIZE_MB=$((PACKAGE_SIZE / 1024 / 1024))
          
          if [ $PACKAGE_SIZE -lt 50000000 ]; then
            echo "✅ $func_name: ${PACKAGE_SIZE_MB}MB (within Lambda limits)"
          else
            echo "⚠️ $func_name: ${PACKAGE_SIZE_MB}MB (approaching Lambda limits)"
          fi
        done

    - name: Build Lambda layers
      run: |
        echo "🏗️ Building Lambda layers..."
        chmod +x lambda_functions/build_layer.sh
        cd lambda_functions
        ./build_layer.sh
        cd ..

    - name: Generate Lambda package manifest
      run: |
        echo "📋 Generating Lambda package manifest..."
        cat > lambda_packages/manifest.json << EOF
        {
          "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "packages": [
        EOF
        
        first=true
        for zip_file in lambda_packages/*.zip; do
          if [ -f "$zip_file" ]; then
            filename=$(basename "$zip_file")
            size=$(stat -c%s "$zip_file" 2>/dev/null || stat -f%z "$zip_file")
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> lambda_packages/manifest.json
            fi
            
            echo "    {" >> lambda_packages/manifest.json
            echo "      \"name\": \"${filename%.*}\"," >> lambda_packages/manifest.json
            echo "      \"filename\": \"$filename\"," >> lambda_packages/manifest.json
            echo "      \"size_bytes\": $size" >> lambda_packages/manifest.json
            echo -n "    }" >> lambda_packages/manifest.json
          fi
        done
        
        cat >> lambda_packages/manifest.json << EOF
        
          ]
        }
        EOF

    - name: Upload Lambda packages
      uses: actions/upload-artifact@v4
      with:
        name: lambda-packages-${{ github.sha }}
        path: lambda_packages/
        retention-days: 30

    - name: Lambda packaging summary
      run: |
        echo "## Lambda Packaging Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Function | Size | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
        
        for zip_file in lambda_packages/*.zip; do
          if [ -f "$zip_file" ]; then
            filename=$(basename "$zip_file" .zip)
            size=$(stat -c%s "$zip_file" 2>/dev/null || stat -f%z "$zip_file")
            size_mb=$((size / 1024 / 1024))
            
            if [ $size -lt 50000000 ]; then
              status="✅ OK"
            else
              status="⚠️ Large"
            fi
            
            echo "| $filename | ${size_mb}MB | $status |" >> $GITHUB_STEP_SUMMARY
          fi
        done

  # Docker Image Building
  docker-build:
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'docker' || github.event.inputs.build_type == ''
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VCS_REF=${{ github.sha }}
          VERSION=${{ github.ref_name }}

    - name: Generate Docker image manifest
      run: |
        echo "🐳 Generating Docker image manifest..."
        cat > docker-manifest.json << EOF
        {
          "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "registry": "${{ env.REGISTRY }}",
          "repository": "${{ env.IMAGE_NAME }}",
          "tags": [
        EOF
        
        echo '${{ steps.meta.outputs.tags }}' | jq -R 'split("\n") | map(select(length > 0)) | map({"tag": ., "digest": null})' | jq -r '.[] | "    " + (. | @json) + ","' | sed '$ s/,$//' >> docker-manifest.json
        
        cat >> docker-manifest.json << EOF
        
          ]
        }
        EOF

    - name: Upload Docker manifest
      uses: actions/upload-artifact@v4
      with:
        name: docker-manifest-${{ github.sha }}
        path: docker-manifest.json
        retention-days: 30

    - name: Docker build summary
      run: |
        echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Built Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  # Terraform Syntax Validation (Fast)
  terraform-syntax-check:
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'terraform' || github.event.inputs.build_type == ''
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        terraform_wrapper: false

    - name: Terraform Format Check
      run: |
        cd terraform
        terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -backend=false

    - name: Terraform Syntax Validation
      env:
        TF_VAR_skip_lambda_package_validation: true
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_VAR_environment: syntax-check
        TF_VAR_project_name: webwunder
      run: |
        cd terraform
        # Fast syntax-only validation without file dependencies
        terraform validate

  # Terraform Full Validation and Planning (With Packages)
  terraform-validate:
    runs-on: ubuntu-latest
    needs: [lambda-packaging, terraform-syntax-check]
    if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'terraform' || github.event.inputs.build_type == ''
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download lambda packages
      uses: actions/download-artifact@v4
      with:
        name: lambda-packages-${{ github.sha }}
        path: lambda_packages/

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -backend=false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Plan (With Packages)
      env:
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_VAR_environment: validation
        TF_VAR_project_name: webwunder
        TF_VAR_lambda_timeout: 30
        TF_VAR_lambda_memory_size: 512
        TF_VAR_lambda_runtime: python3.11
        TF_VAR_api_gateway_stage_name: validation
        TF_VAR_dynamodb_billing_mode: PAY_PER_REQUEST
        TF_VAR_cloudwatch_log_retention_days: 14
        TF_VAR_skip_lambda_package_validation: false
        TF_VAR_lambda_package_path: ../lambda_packages
      run: |
        cd terraform
        # Create terraform.tfvars for planning with actual packages
        cat > terraform.tfvars.validation << EOF
        aws_region = "${{ env.AWS_REGION }}"
        environment = "validation"
        project_name = "webwunder"
        lambda_timeout = 30
        lambda_memory_size = 512
        lambda_runtime = "python3.11"
        api_gateway_stage_name = "validation"
        dynamodb_billing_mode = "PAY_PER_REQUEST"
        cloudwatch_log_retention_days = 14
        skip_lambda_package_validation = false
        lambda_package_path = "../lambda_packages"
        common_tags = {
          Environment = "validation"
          Project     = "webwunder"
          ManagedBy   = "terraform"
          Repository  = "webwunder"
        }
        EOF
        
        # Run terraform plan with actual packages
        terraform plan -var-file=terraform.tfvars.validation -out=tfplan.validation
        
        # Generate plan summary
        terraform show -json tfplan.validation > tfplan.json

    - name: Generate Terraform summary
      run: |
        cd terraform
        echo "## Terraform Validation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count resources
        if [ -f tfplan.json ]; then
          RESOURCES_TO_ADD=$(jq -r '.planned_values.root_module.resources // [] | length' tfplan.json)
          echo "**Resources to be created:** $RESOURCES_TO_ADD" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Validation Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
        echo "**Format Check:** $(terraform fmt -check -recursive > /dev/null 2>&1 && echo '✅ Passed' || echo '⚠️ Needs formatting')" >> $GITHUB_STEP_SUMMARY

    - name: Upload Terraform artifacts
      uses: actions/upload-artifact@v4
      with:
        name: terraform-artifacts-${{ github.sha }}
        path: |
          terraform/tfplan.validation
          terraform/tfplan.json
        retention-days: 30

  # Artifact Storage and Versioning
  artifact-storage:
    runs-on: ubuntu-latest
    needs: [lambda-packaging, docker-build, terraform-syntax-check, terraform-validate]
    if: always() && (needs.lambda-packaging.result == 'success' || needs.docker-build.result == 'success' || needs.terraform-validate.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "*-${{ github.sha }}"
        merge-multiple: true

    - name: Generate build manifest
      run: |
        echo "📋 Generating comprehensive build manifest..."
        cat > build-manifest.json << EOF
        {
          "build_info": {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}"
          },
          "artifacts": {
            "lambda_packages": $([ -d "lambda-packages-${{ github.sha }}" ] && echo "true" || echo "false"),
            "docker_images": $([ -f "docker-manifest-${{ github.sha }}/docker-manifest.json" ] && echo "true" || echo "false"),
            "terraform_plan": $([ -d "terraform-artifacts-${{ github.sha }}" ] && echo "true" || echo "false")
          },
          "job_results": {
            "lambda_packaging": "${{ needs.lambda-packaging.result }}",
            "docker_build": "${{ needs.docker-build.result }}",
            "terraform_validate": "${{ needs.terraform-validate.result }}"
          }
        }
        EOF

    - name: Create release archive
      run: |
        echo "📦 Creating release archive..."
        mkdir -p release-${{ github.sha }}
        
        # Copy Lambda packages if available
        if [ -d "lambda-packages-${{ github.sha }}" ]; then
          cp -r lambda-packages-${{ github.sha }}/* release-${{ github.sha }}/
        fi
        
        # Copy Docker manifest if available
        if [ -f "docker-manifest-${{ github.sha }}/docker-manifest.json" ]; then
          cp docker-manifest-${{ github.sha }}/docker-manifest.json release-${{ github.sha }}/
        fi
        
        # Copy Terraform artifacts if available
        if [ -d "terraform-artifacts-${{ github.sha }}" ]; then
          mkdir -p release-${{ github.sha }}/terraform
          cp terraform-artifacts-${{ github.sha }}/* release-${{ github.sha }}/terraform/
        fi
        
        # Add build manifest
        cp build-manifest.json release-${{ github.sha }}/
        
        # Create versioned archive
        tar -czf webwunder-build-${{ github.sha }}.tar.gz release-${{ github.sha }}/

    - name: Upload release archive
      uses: actions/upload-artifact@v4
      with:
        name: webwunder-release-${{ github.sha }}
        path: |
          webwunder-build-${{ github.sha }}.tar.gz
          build-manifest.json
        retention-days: 90

    - name: Build and package summary
      run: |
        echo "# Build and Package Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build ID:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Job Results" >> $GITHUB_STEP_SUMMARY
        echo "- Lambda Packaging: ${{ needs.lambda-packaging.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Terraform Validation: ${{ needs.terraform-validate.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        echo "- Release Archive: webwunder-build-${{ github.sha }}.tar.gz" >> $GITHUB_STEP_SUMMARY
        echo "- Retention: 90 days" >> $GITHUB_STEP_SUMMARY

  # Quality Gate for Build and Package
  build-quality-gate:
    runs-on: ubuntu-latest
    needs: [lambda-packaging, docker-build, terraform-syntax-check, terraform-validate, artifact-storage]
    if: always()
    
    steps:
    - name: Check build quality gate
      run: |
        echo "🚪 Checking build and package quality gate..."
        
        # Check critical jobs
        if [[ "${{ needs.lambda-packaging.result }}" != "success" ]]; then
          echo "❌ Lambda packaging failed"
          exit 1
        fi
        
        if [[ "${{ needs.terraform-syntax-check.result }}" != "success" ]]; then
          echo "❌ Terraform syntax check failed"
          exit 1
        fi
        
        if [[ "${{ needs.terraform-validate.result }}" != "success" ]]; then
          echo "❌ Terraform validation failed"
          exit 1
        fi
        
        # Docker build is allowed to fail with warning (for forks without registry access)
        if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
          echo "⚠️ Docker build failed - check registry permissions"
        fi
        
        if [[ "${{ needs.artifact-storage.result }}" != "success" ]]; then
          echo "❌ Artifact storage failed"
          exit 1
        fi
        
        echo "✅ Build and package quality gate passed"
        echo "All critical build components completed successfully"