name: Nuclear Cleanup
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type NUKE to confirm'
        required: true

jobs:
  nuke:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'NUKE'
    steps:
    - uses: actions/checkout@v3
    - name: Setup AWS Nuke
      run: |
        wget https://github.com/rebuy-de/aws-nuke/releases/download/v2.25.0/aws-nuke-v2.25.0-linux-amd64.tar.gz
        tar -xzf aws-nuke-v2.25.0-linux-amd64.tar.gz
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1
    - name: Nuke Everything
      run: ./aws-nuke-v2.25.0-linux-amd64 -c nuke-config.yml --no-dry-run