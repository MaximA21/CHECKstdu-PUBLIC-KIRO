# Docker Compose configuration for WebWunder container deployment

version: '3.8'

services:
  # Main HTTP API service
  webwunder-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webwunder-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENVIRONMENT=production
      - PORT=8080
      - CONFIG_DIR=/app/config
      - DB_PROVIDER=mock
      - MSG_PROVIDER=mock
      - LOG_PROVIDER=console
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - webwunder-network

  # Standalone WebSocket service
  webwunder-websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webwunder-websocket
    ports:
      - "8081:8081"
    environment:
      - APP_ENVIRONMENT=production
      - WS_HOST=0.0.0.0
      - WS_PORT=8081
      - CONFIG_DIR=/app/config
      - DB_PROVIDER=mock
      - MSG_PROVIDER=mock
      - LOG_PROVIDER=console
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["python", "-m", "src.presentation.websocket_server"]
    networks:
      - webwunder-network

  # Redis for session storage (optional)
  redis:
    image: redis:7-alpine
    container_name: webwunder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - webwunder-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: webwunder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - webwunder-api
      - webwunder-websocket
    restart: unless-stopped
    networks:
      - webwunder-network

volumes:
  redis-data:

networks:
  webwunder-network:
    driver: bridge